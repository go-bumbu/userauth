<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; margin: 0; padding: 20px; }
  .container { max-width: 400px; margin: 0 auto; background: #ffffff; border-radius: 8px; padding: 32px; }
  .code { font-size: 32px; font-weight: bold; letter-spacing: 6px; text-align: center; padding: 16px; background: #f0f0f0; border-radius: 4px; margin: 24px 0; font-family: monospace; }
  .expires { color: #666; font-size: 14px; text-align: center; }
</style>
</head>
<body>
<div class="container">
  <p>Your verification code is:</p>
  <div class="code">{{.Code}}</div>
  <p class="expires">This code expires in {{.ExpiresIn}}.</p>
  <p class="expires">If you did not request this code, you can safely ignore this email.</p>
</div>
</body>
</html>
