<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Password + TOTP Login</title>
    <link rel="stylesheet" type="text/css" href="/styles.css">
</head>
<body>
<h3>Password + TOTP login</h3>
<p class="info" style="text-align:center;">
    Step 1 of 2: enter your password. An authenticator code is required next.
</p>

{{if .Error}}
<p class="error">{{.Error}}</p>
{{end}}

<form class="login-form" method="POST" action="/totp/login">
    <label for="username">Username</label>
    <input type="text" id="username" name="username" autocomplete="username" required>

    <label for="password">Password</label>
    <input type="password" id="password" name="password" autocomplete="current-password" required>

    <button type="submit">Continue</button>
</form>

<p class="info">Demo account: <code>demo:demo</code></p>

<p><a href="/">← Back</a></p>
</body>
</html>
