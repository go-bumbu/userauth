<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Passwordless Login</title>
    <link rel="stylesheet" type="text/css" href="/styles.css">
</head>
<body>
<h3>Passwordless login</h3>
<p class="info" style="text-align:center;">
    Enter your email and a 6-digit login code will be shown on the next page,
    simulating an email delivery. No password required.
</p>

{{if .Error}}
<p class="error">{{.Error}}</p>
{{end}}

<form class="login-form" method="POST" action="/emailcode/login">
    <label for="email">Email address</label>
    <input type="email" id="email" name="email" value="{{.Email}}" autocomplete="email" required>

    <button type="submit">Send login code</button>
</form>

{{if .Emails}}
<p class="info">Demo accounts: {{range .Emails}}<code>{{.}}</code> {{end}}</p>
{{end}}

<p><a href="/">← Back</a></p>
</body>
</html>
