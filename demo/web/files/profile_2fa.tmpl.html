<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Two-factor authentication</title>
    <link rel="stylesheet" type="text/css" href="/styles.css">
</head>
<body>
<h3>Two-factor authentication</h3>
<p class="info" style="text-align:center;">Enter the 6-digit code from your authenticator app.</p>

{{if .Error}}
<p class="error">{{.Error}}</p>
{{end}}

<form class="login-form" method="POST" action="/profile/login/2fa">
    <input type="hidden" name="userID" value="{{.UserID}}">

    <label for="code">Authenticator code</label>
    <input type="text" id="code" name="code" inputmode="numeric" autocomplete="one-time-code"
           placeholder="123456" required autofocus>

    <button type="submit">Verify</button>
</form>

<p class="info" style="text-align:center;">Lost your device? Enter one of your recovery codes in the field above instead.</p>
<p><a href="/profile/login">← Back to login</a></p>
</body>
</html>
